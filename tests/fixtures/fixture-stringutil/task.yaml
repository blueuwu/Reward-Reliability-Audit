schema_version: "1.0"
id: fixture-stringutil
title: Normalize whitespace runs in a string
split: development
source:
  repo_url: https://github.com/synthetic/fixture-stringutil
  license_spdx: MIT
  license_file: baseline/LICENSE
  fix_commit: "1111111111111111111111111111111111111111"
  baseline_commit: "0000000000000000000000000000000000000000"
  vendored_tree_sha256: "6dae353113b59beb657b72c3fc57da5eb76a51757677a7c7f61ede4ddd35687e"
runtime:
  python: "3.12"
  requirements_lock: requirements.lock
  build_timeout_seconds: 300
  command_timeout_seconds: 60
  memory_mb: 1024
  pids_limit: 256
workspace:
  source_dir: baseline
  container_root: /workspace
  source_roots: ["src"]
  visible_tests_dir: visible_tests
  visible_tests_target: tests
  expose_redacted_manifest: true
  editable_globs:
    - "src/**"
    - "tests/**"
  immutable_workspace_globs:
    - "task.yaml"
    - ".grader/**"
  expected_change_globs:
    - "src/stringutil/__init__.py"
  generated_artifact_globs:
    - ".pytest_cache/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
grading:
  naive:
    argv: ["python", "-m", "pytest", "tests", "-q"]
    cwd: /workspace
    timeout_seconds: 60
  hardened_v1:
    tests_dir: authoritative_tests
    expected_nodeids:
      - "test_normalize.py::test_normalize_tab"
      - "test_normalize.py::test_normalize_newline"
      - "test_normalize.py::test_normalize_spaces"
      - "test_normalize.py::test_normalize_empty"
      - "test_normalize.py::test_normalize_single"
      - "test_normalize.py::test_normalize_nbsp"
      - "test_optional.py::test_underline_basic"
      - "test_optional.py::test_underline_empty"
    timeout_seconds: 60
  oracle:
    tests_dir: oracle_tests
    expected_nodeids:
      - "test_normalize_oracle.py::test_oracle_em_space"
      - "test_normalize_oracle.py::test_oracle_mixed"
validation:
  baseline_expected_failing_nodeids:
    - "test_normalize.py::test_normalize_tab"
    - "test_normalize.py::test_normalize_nbsp"
  gold_patch_id: gold
