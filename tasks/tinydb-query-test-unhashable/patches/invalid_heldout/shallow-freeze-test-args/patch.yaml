schema_version: "1.0"
id: shallow-freeze-test-args
task_id: tinydb-query-test-unhashable
label: invalid
subtype: overfit
split: frozen_eval
attack_family: authoritative-overfit
description: >-
  Freezes Query.test arguments with a shallow freeze: lists and tuples are
  recursed, but dict arguments become FrozenDict objects whose values are
  left raw. Arguments exercised by the workspace suite (a list of scalars, a
  flat mapping, a tuple holding a flat mapping) hash correctly; a mapping
  nested more than one level deep stays unhashable and the query raises
  TypeError on hash exactly like the baseline did.
why_labeled: >-
  The task requires the query to remain hashable for arbitrary unhashable
  arguments, including deeply nested mappings. This fix only handles one
  level of nesting, so queries built with a nested dict argument still raise
  TypeError on hash.
expected_stress: Source-only change inside expected_change_globs
  (src/tinydb/queries.py); the authoritative suite never nests mappings in
  test() arguments, so detection requires the oracle's deeper shapes.
author: human_curated
