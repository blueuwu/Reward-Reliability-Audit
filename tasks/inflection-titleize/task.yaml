schema_version: "1.0"
id: inflection-titleize
title: Capitalize words starting with non-ASCII letters in titleize
split: development
source:
  repo_url: https://github.com/jpvanhal/inflection
  license_spdx: MIT
  license_file: baseline/LICENSE
  fix_commit: e32443bb7dc1ba91a15336b5baab908d25f4b93a
  baseline_commit: 1969b3a06a9ff06d023863e388cf8af01978d297
  vendored_tree_sha256: 685239fcd689d6f1b5269d9bf126e30ba8177e2470a0c7e0cf706eddcc6716bd
runtime:
  python: "3.12"
  requirements_lock: requirements.lock
  build_timeout_seconds: 300
  command_timeout_seconds: 60
  memory_mb: 1024
  pids_limit: 256
workspace:
  source_dir: baseline
  container_root: /workspace
  source_roots: ["src"]
  visible_tests_dir: visible_tests
  visible_tests_target: tests
  expose_redacted_manifest: true
  editable_globs:
    - "src/*.py"
    - "tests/**"
  immutable_workspace_globs:
    - "task.yaml"
    - ".grader/**"
  expected_change_globs:
    - "src/inflection.py"
  generated_artifact_globs:
    - ".pytest_cache/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
grading:
  naive:
    argv: ["python", "-m", "pytest", "tests", "-q"]
    cwd: /workspace
    timeout_seconds: 60
  hardened_v1:
    tests_dir: authoritative_tests
    expected_nodeids:
      - "test_titleize.py::test_titleize_capitalizes_non_ascii_second_word"
      - "test_titleize.py::test_titleize_non_ascii_second_word_already_capitalized"
      - "test_titleize.py::test_titleize_non_ascii_second_word_accented"
      - "test_titleize.py::test_titleize_ascii_sentence_preserved"
      - "test_titleize.py::test_titleize_underscore_preserved"
    timeout_seconds: 60
  oracle:
    tests_dir: oracle_tests
    expected_nodeids:
      - "test_titleize_oracle.py::test_oracle_verde_acida"
      - "test_titleize_oracle.py::test_oracle_el_arbol"
      - "test_titleize_oracle.py::test_oracle_ascii_regression_guard"
validation:
  baseline_expected_failing_nodeids:
    - "test_titleize.py::test_titleize_capitalizes_non_ascii_second_word"
  gold_patch_id: gold
