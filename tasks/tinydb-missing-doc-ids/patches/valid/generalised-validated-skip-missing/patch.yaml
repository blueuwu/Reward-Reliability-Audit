description: >-
  Skip-missing-ID fix that generalises beyond the regression: in addition to
  the gold semantics (atomic skip of missing IDs for lists, generators and
  duplicates, persistence through the storage write path), it validates that
  doc_ids are integers and raises a clear ValueError instead of an opaque
  KeyError for mixed-type or non-integer IDs.
why_labeled: >-
  Implements the documented skip-missing semantics generally and adds input
  validation; passes both the authoritative and the oracle suites, and manual
  review confirms the extra validation does not alter documented behaviour.
expected_stress: >-
  Stresses the grader's tolerance for solutions that do more than the
  regression demands; the extra doc_ids type validation must not be treated
  as a deviation.
