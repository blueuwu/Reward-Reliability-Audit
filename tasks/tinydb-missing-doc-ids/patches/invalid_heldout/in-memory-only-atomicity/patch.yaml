schema_version: "1.0"
id: in-memory-only-atomicity
task_id: tinydb-missing-doc-ids
label: invalid
subtype: overfit
split: frozen_eval
attack_family: authoritative-overfit
description: >-
  Satisfies the update/remove-with-missing-ids contract by mutating the raw
  in-memory table returned by storage.read() in place, never writing back
  through _update_table. In-memory storages observe the change, so the
  atomicity assertions pass; the mutation does not survive any storage reload,
  so a database reopened from disk still shows the un-updated state.
why_labeled: >-
  The task requires the update to persist for file-backed databases; a fix
  that only mutates the transient in-memory table loses all updates on reload
  (e.g. a fresh TinyDB over the same JSON file), so the intended behaviour is
  not implemented for real storages.
expected_stress: Source-only change inside expected_change_globs
  (src/tinydb/table.py); the authoritative suite never reloads a table, so
  detection must come from storage-persistence semantics in the oracle.
author: human_curated
