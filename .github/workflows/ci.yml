name: CI

on:
  push:
  pull_request:

jobs:
  static:
    name: Static (Linux, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # verify-v1-lock resolves refs/tags/grader-v1-frozen; the default
          # shallow fetch does not bring tags down.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure Git identity (doctor prerequisite)
        run: |
          git config user.name "grader-audit CI"
          git config user.email "grader-audit-ci@example.com"

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright (strict, v1 + v2)
        run: uv run pyright

      - name: Pytest (unit, no Docker tests)
        run: uv run pytest -q tests grader_v2/tests --ignore=grader_v2/tests/test_deployment_container.py

  container-integration:
    name: Container integration + release gate (Linux, Docker required)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # verify-v1-lock resolves refs/tags/grader-v1-frozen; the default
          # shallow fetch does not bring tags down.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure Git identity (doctor prerequisite)
        run: |
          git config user.name "grader-audit CI"
          git config user.email "grader-audit-ci@example.com"

      - name: Allow unprivileged user namespaces (bwrap in the deployment container)
        run: |
          # The HUD workspace isolates agent SSH sessions with bwrap, which is
          # installed in Dockerfile.hud. Two independent gates block its user
          # namespace on ubuntu-24.04, and BOTH must be lifted:
          #   1. this sysctl, which denies unprivileged userns creation to
          #      AppArmor-*unconfined* processes;
          #   2. Docker's AppArmor and seccomp profiles, which restrict nested
          #      namespace setup -- both are lifted per-container by
          #      start_deployment_container. SYS_ADMIN and NET_ADMIN are granted
          #      to bwrap for setup and dropped after setup by setpriv before the
          #      command runs in its sandbox.
          # The sysctl alone is not sufficient: it governs the unconfined host
          # policy but does not override Docker's per-container profiles.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Probe bwrap namespace support (diagnostic; never fails the job)
        run: |
          set +e
          echo "== host userns policy =="
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sysctl kernel.unprivileged_userns_clone
          echo "== loaded apparmor profiles =="
          sudo aa-status --profiled
          echo "== deployment image (also warms the build cache for pytest) =="
          IMAGE=$(uv run python -c "from pathlib import Path; from grader_v2.hud.runtime import resolve_deployment_image; print(resolve_deployment_image(Path('.'), build=True))" | tail -1)
          echo "image=$IMAGE"
          BW="bwrap --die-with-parent --unshare-user-try --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --unshare-net --bind / / -- setpriv --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs -- true"
          probe() {
            docker run --rm $1 "$IMAGE" sh -c "$BW" >/dev/null 2>/tmp/bwrap-err
            rc=$?
            echo "  exit=$rc opts='${1:-<none>}' err=$(tr '\n' ' ' </tmp/bwrap-err | cut -c1-200)"
          }
          echo "== bwrap under candidate docker flags =="
          probe ""
          probe "--security-opt apparmor=unconfined"
          probe "--security-opt seccomp=unconfined"
          probe "--security-opt apparmor=unconfined --security-opt seccomp=unconfined"
          probe "--cap-add SYS_ADMIN --cap-add NET_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined"
          exit 0

      - name: Doctor (strict Docker mode)
        run: GRADER_AUDIT_REQUIRE_DOCKER=1 uv run grader-audit doctor

      - name: Pytest (strict Docker mode; zero unexpected skips)
        run: GRADER_AUDIT_REQUIRE_DOCKER=1 uv run pytest -q -ra

      - name: v1 freeze lock (read-only, Track-B exceptions)
        run: uv run grader-v2 verify-v1-lock

      - name: Publication validation (read-only)
        run: uv run grader-v2 publication --mode validate

      - name: Application demo (HUD deployment image, end-to-end)
        run: uv run grader-v2 demo

  windows-orchestration:
    name: Windows orchestration (paths, reports, preflight)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # verify-v1-lock resolves refs/tags/grader-v1-frozen; the default
          # shallow fetch does not bring tags down.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure Git identity (doctor prerequisite)
        run: |
          git config user.name "grader-audit CI"
          git config user.email "grader-audit-ci@example.com"

      - name: Pytest (unit; deployment-container tests require Linux Docker)
        run: uv run pytest -q tests grader_v2/tests --ignore=grader_v2/tests/test_deployment_container.py

      - name: Publication validation (read-only)
        run: uv run grader-v2 publication --mode validate
