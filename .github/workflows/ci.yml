name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    name: Quality gates (Gates 1-2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure Git identity (doctor prerequisite)
        run: |
          git config user.name "grader-audit CI"
          git config user.email "grader-audit-ci@example.com"

      - name: Doctor
        run: uv run grader-audit doctor

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest (unit + Gate 1-2 Docker integration)
        run: uv run pytest -q
